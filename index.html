
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Object Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    padding: 25px;
}

h1 {
    color: #00e5ff;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.camera {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: auto;
    background: #000;
    border: 2px solid #00e5ff;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

button {
    background: #00e5ff;
    color: #101827;
    border: none;
    padding: 13px 25px;
    margin: 15px 5px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00bcd4;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin: 15px;
    color: #00e5ff;
}

.results {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    text-align: left;
}

.results h2 {
    color: #00e5ff;
    margin-bottom: 12px;
}

#detections {
    line-height: 2;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Object Detection</h1>
<p class="subtitle">Real-Time Object Detection Using Artificial Intelligence</p>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<button id="startBtn" onclick="startCamera()">Start Camera</button>
<button id="stopBtn" onclick="stopCamera()" disabled>Stop Camera</button>

<p id="status">Loading AI model...</p>

<div class="results">
    <h2>Detected Objects</h2>
    <div id="detections">No objects detected yet.</div>
</div>

</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const detections = document.getElementById("detections");

let model = null;
let stream = null;
let detecting = false;

async function loadModel() {
    try {
        statusText.textContent = "Loading AI model...";

        model = await cocoSsd.load();

        statusText.textContent = "AI Model Ready! Start your camera.";
    } catch (error) {
        statusText.textContent = "Model loading failed. Check internet connection.";
        console.error(error);
    }
}

async function startCamera() {
    if (!model) {
        statusText.textContent = "Please wait for AI model to load.";
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        detecting = true;

        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;

        statusText.textContent = "AI Detection Running...";
        detectObjects();

    } catch (error) {
        statusText.textContent =
            "Camera access failed. Please allow camera permission.";
        console.error(error);
    }
}

async function detectObjects() {
    if (!detecting || !model) return;

    try {
        const predictions = await model.detect(video);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let output = "";

        predictions.forEach(prediction => {
            const [x, y, width, height] = prediction.bbox;

            const confidence =
                (prediction.score * 100).toFixed(1);

            // Draw bounding box
            ctx.strokeStyle = "#00ff88";
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            // Draw object label
            ctx.fillStyle = "#00ff88";
            ctx.font = "bold 16px Arial";

            const label =
                prediction.class + " " + confidence + "%";

            const labelWidth =
                ctx.measureText(label).width + 10;

            ctx.fillRect(
                x,
                Math.max(0, y - 25),
                labelWidth,
                25
            );

            ctx.fillStyle = "#000";
            ctx.fillText(
                label,
                x + 5,
                Math.max(17, y - 7)
            );

            output += `
                <div>
                    🟢 <b>${prediction.class}</b>
                    - ${confidence}% confidence
                </div>
            `;
        });

        detections.innerHTML =
            output || "No objects detected.";

    } catch (error) {
        console.error("Detection error:", error);
    }

    if (detecting) {
        requestAnimationFrame(detectObjects);
    }
}

function stopCamera() {
    detecting = false;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    detections.textContent = "Camera stopped.";
    statusText.textContent = "Detection stopped.";

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
}

loadModel();
</script>

</body>
</html>
